    <text x="922" y="172" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7d8794">blocked · action · waiting</text>
    <path d="M760 258 C 830 258, 830 259, 900 259" fill="none" stroke="#e58ef0" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="900" y="222" width="324" height="74" rx="10" fill="#11161d" stroke="#e58ef0" stroke-opacity="0.55" stroke-dasharray="6 5"/>
    <rect x="900" y="236" width="4" height="46" rx="2" fill="#e58ef0"/>
    <text x="922" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#e58ef0">EVIDENCE GAPS</text>
    <text x="922" y="276" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7d8794">unknown, never a guessed pass</text>
    <path d="M760 258 C 830 258, 830 363, 900 363" fill="none" stroke="#6fdc8c" stroke-width="2"/>
    <rect x="900" y="326" width="324" height="74" rx="10" fill="#11161d" stroke="#6fdc8c" stroke-opacity="0.55"/>
    <rect x="900" y="340" width="4" height="46" rx="2" fill="#6fdc8c"/>
    <text x="922" y="357" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#6fdc8c">NEXT STEPS</text>
    <text x="922" y="380" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7d8794">one instruction per actor</text>
  <rect x="560" y="196" width="200" height="124" rx="14" fill="#11161d" stroke="#ffb43d" stroke-width="1.6"/>
  <rect x="622" y="218" width="34" height="44" rx="2.7" fill="#1a212b" stroke="#232c38"/><line x1="623" x2="655" y1="240" y2="240" stroke="#07090c" stroke-width="1" stroke-opacity="0.55"/><text x="639" y="240" text-anchor="middle" dominant-baseline="central" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffb43d">P</text><rect x="664" y="218" width="34" height="44" rx="2.7" fill="#1a212b" stroke="#232c38"/><line x1="665" x2="697" y1="240" y2="240" stroke="#07090c" stroke-width="1" stroke-opacity="0.55"/><text x="681" y="240" text-anchor="middle" dominant-baseline="central" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffb43d">R</text>
  <text x="660" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.5" fill="#e8e2d6">DETERMINISTIC RULES</text>
  <text x="660" y="470" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7d8794">GET requests and GraphQL queries only. No comments, approvals, reruns, labels or merges.</text>
</svg>
