<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="ft fd">
  <title id="ft">How Maniflight reads a pull request</title>
  <desc id="fd">Seven read-only GitHub sources feed a deterministic classifier, which separates observed conditions from evidence gaps and produces next steps for each actor.</desc>
  <rect width="1280" height="500" rx="18" fill="#0b0e13"/>
  <rect x="0.5" y="0.5" width="1279" height="499" rx="17.5" fill="none" stroke="#2a3340"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="12" letter-spacing="2.2" fill="#7d8794">
    <text x="56" y="62">READ-ONLY EVIDENCE</text>
    <text x="660" y="62" text-anchor="middle">CLASSIFY</text>
    <text x="900" y="62">FLIGHT PLAN</text>
  </g>
    <path d="M324 112 C 444 112, 450 258, 560 258" fill="none" stroke="#8a6a35" stroke-width="1.4"/>
    <rect x="56" y="92" width="268" height="40" rx="8" fill="#11161d" stroke="#2a3340"/>
    <circle cx="76" cy="112" r="4" fill="#ffb43d"/>
    <text x="92" y="112" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#e8e2d6">Pull request</text>
    <path d="M324 164 C 444 164, 450 258, 560 258" fill="none" stroke="#8a6a35" stroke-width="1.4"/>
    <rect x="56" y="144" width="268" height="40" rx="8" fill="#11161d" stroke="#2a3340"/>
    <circle cx="76" cy="164" r="4" fill="#ffb43d"/>
    <text x="92" y="164" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#e8e2d6">GraphQL review state</text>
    <path d="M324 216 C 444 216, 450 258, 560 258" fill="none" stroke="#8a6a35" stroke-width="1.4"/>
    <rect x="56" y="196" width="268" height="40" rx="8" fill="#11161d" stroke="#2a3340"/>
    <circle cx="76" cy="216" r="4" fill="#ffb43d"/>
    <text x="92" y="216" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#e8e2d6">Reviews</text>
    <path d="M324 268 C 444 268, 450 258, 560 258" fill="none" stroke="#8a6a35" stroke-width="1.4"/>
    <rect x="56" y="248" width="268" height="40" rx="8" fill="#11161d" stroke="#2a3340"/>
    <circle cx="76" cy="268" r="4" fill="#ffb43d"/>
    <text x="92" y="268" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#e8e2d6">Check runs</text>
    <path d="M324 320 C 444 320, 450 258, 560 258" fill="none" stroke="#8a6a35" stroke-width="1.4"/>
    <rect x="56" y="300" width="268" height="40" rx="8" fill="#11161d" stroke="#2a3340"/>
    <circle cx="76" cy="320" r="4" fill="#ffb43d"/>
    <text x="92" y="320" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#e8e2d6">Commit statuses</text>
    <path d="M324 372 C 444 372, 450 258, 560 258" fill="none" stroke="#8a6a35" stroke-width="1.4"/>
    <rect x="56" y="352" width="268" height="40" rx="8" fill="#11161d" stroke="#2a3340"/>
    <circle cx="76" cy="372" r="4" fill="#ffb43d"/>
    <text x="92" y="372" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#e8e2d6">Actions runs</text>
    <path d="M324 424 C 444 424, 450 258, 560 258" fill="none" stroke="#8a6a35" stroke-width="1.4"/>
    <rect x="56" y="404" width="268" height="40" rx="8" fill="#11161d" stroke="#2a3340"/>
    <circle cx="76" cy="424" r="4" fill="#ffb43d"/>
    <text x="92" y="424" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#e8e2d6">Active branch rules</text>
